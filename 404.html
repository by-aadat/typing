<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Global Vision Public School</title>
<meta name="robots" content="noindex">
<script>
  /* GitHub Pages serves this file for any unknown path. Send the visitor
     back to the app, keeping whatever hash route they were after. */
  var base = location.pathname.replace(/\/[^\/]*$/, "/");
  location.replace(base + (location.hash || "#/home"));
</script>
</head>
<body style="font-family:system-ui;padding:40px">
  <p>Taking you back to the school website…</p>
  <p><a href="./">Global Vision Public School</a></p>
</body>
</html>
